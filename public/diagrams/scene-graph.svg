<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">A scene graph composes local transforms</title><desc id="desc">A child inherits its parent’s transform, then applies its own local transform. A mesh combines geometry and material. A group organizes transforms without needing visible geometry.</desc><defs><marker id="78efce" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#78efce"/></marker><marker id="82b6ff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#82b6ff"/></marker><marker id="ffc19b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ffc19b"/></marker><marker id="aebfd0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#aebfd0"/></marker><linearGradient id="surface" x1="0" x2="1" color-interpolation="linearRGB"><stop offset="0" stop-color="#192c42"/><stop offset="0.35" stop-color="#234455"/><stop offset="0.7" stop-color="#2b5c65"/><stop offset="1" stop-color="#488a80"/></linearGradient></defs><rect width="1000" height="600" rx="22" fill="#101827"/><g font-family="Segoe UI, Arial, sans-serif"><text x="42" y="52" font-size="29" fill="#eef5f8" text-anchor="start" font-weight="650">A scene graph composes local transforms</text><text x="42" y="85" font-size="17" fill="#aebfd0" text-anchor="start" font-weight="400">A child inherits its parent’s transform, then applies its own local transform.</text><rect x="42" y="125" width="550" height="385" rx="15" fill="#172337" stroke="#26384b"/><rect x="617" y="125" width="341" height="385" rx="15" fill="#172337" stroke="#26384b"/><path d="M 315 218 V 277" stroke="#aebfd0" stroke-width="2" fill="none"/><path d="M 315 339 V 369 H 184 V 402 M 315 369 H 437 V 402" stroke="#aebfd0" stroke-width="2" fill="none"/><rect x="205" y="156" width="220" height="62" rx="11" fill="#1c2b40" stroke="#82b6ff"/><text x="315.0" y="195" font-size="22" fill="#82b6ff" text-anchor="middle" font-weight="600">Scene / root</text><rect x="205" y="277" width="220" height="62" rx="11" fill="#1c2b40" stroke="#78efce"/><text x="315.0" y="316" font-size="22" fill="#78efce" text-anchor="middle" font-weight="600">Orbit group</text><rect x="83" y="402" width="202" height="62" rx="11" fill="#1c2b40" stroke="#ffc19b"/><text x="184.0" y="441" font-size="22" fill="#ffc19b" text-anchor="middle" font-weight="600">Planet mesh</text><rect x="326" y="402" width="222" height="62" rx="11" fill="#1c2b40" stroke="#78efce"/><text x="437.0" y="441" font-size="22" fill="#78efce" text-anchor="middle" font-weight="600">Moon group</text><text x="642" y="168" font-size="23" fill="#78efce" text-anchor="start" font-weight="600">Local → world</text><text x="642" y="227" font-size="22" fill="#eef5f8" text-anchor="start" font-weight="400">Wchild = Wparent Lchild</text><text x="642" y="287" font-size="20" fill="#ffc19b" text-anchor="start" font-weight="400">Move a parent:</text><text x="642" y="321" font-size="20" fill="#eef5f8" text-anchor="start" font-weight="400">all descendants follow.</text><text x="642" y="380" font-size="19" fill="#eef5f8" text-anchor="start" font-weight="400">Geometry stays in its</text><text x="642" y="411" font-size="19" fill="#eef5f8" text-anchor="start" font-weight="400">own local coordinates.</text><text x="642" y="475" font-size="16" fill="#aebfd0" text-anchor="start" font-weight="400">Share geometry; vary transforms.</text><line x1="42" y1="542" x2="958" y2="542" stroke="#26384b" stroke-width="2"/><text x="42" y="565" font-size="15" fill="#aebfd0" text-anchor="start" font-weight="400">A mesh combines geometry and material. A group organizes transforms without needing visible geometry.</text></g></svg>