<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Perspective is division by distance</title><desc id="desc">The visible volume is a frustum: a pyramid cut by near and far planes. This is a side view. The horizontal field of view is also affected by the canvas aspect ratio.</desc><defs><marker id="78efce" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#78efce"/></marker><marker id="82b6ff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#82b6ff"/></marker><marker id="ffc19b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ffc19b"/></marker><marker id="aebfd0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#aebfd0"/></marker><linearGradient id="surface" x1="0" x2="1" color-interpolation="linearRGB"><stop offset="0" stop-color="#192c42"/><stop offset="0.35" stop-color="#234455"/><stop offset="0.7" stop-color="#2b5c65"/><stop offset="1" stop-color="#488a80"/></linearGradient></defs><rect width="1000" height="600" rx="22" fill="#101827"/><g font-family="Segoe UI, Arial, sans-serif"><text x="42" y="52" font-size="29" fill="#eef5f8" text-anchor="start" font-weight="650">Perspective is division by distance</text><text x="42" y="85" font-size="17" fill="#aebfd0" text-anchor="start" font-weight="400">The visible volume is a frustum: a pyramid cut by near and far planes.</text><rect x="42" y="124" width="610" height="386" rx="15" fill="#172337" stroke="#26384b"/><rect x="677" y="124" width="281" height="386" rx="15" fill="#172337" stroke="#26384b"/><text x="65" y="159" font-size="21" fill="#78efce" text-anchor="start" font-weight="600">Side view: a pinhole camera</text><circle cx="110" cy="320" r="9" fill="#ffc19b" stroke="none"/><text x="70" y="357" font-size="18" fill="#ffc19b" text-anchor="start" font-weight="400">eye</text><line x1="110" y1="320" x2="603" y2="320" stroke="#aebfd0" stroke-width="2" stroke-dasharray="6 6"/><path d="M 110 320 L 593 169 L 593 471 Z" stroke="#82b6ff" stroke-width="2" fill="#172c42"/><line x1="253" y1="275" x2="253" y2="365" stroke="#78efce" stroke-width="4"/><line x1="593" y1="169" x2="593" y2="471" stroke="#82b6ff" stroke-width="4"/><text x="253" y="403" font-size="19" fill="#78efce" text-anchor="middle" font-weight="400">near</text><text x="593" y="503" font-size="19" fill="#82b6ff" text-anchor="middle" font-weight="400">far</text><line x1="420" y1="320" x2="420" y2="223" stroke="#ffc19b" stroke-width="5"/><text x="434" y="245" font-size="18" fill="#ffc19b" text-anchor="start" font-weight="400">height y</text><line x1="110" y1="320" x2="420" y2="223" stroke="#ffc19b" stroke-width="2"/><line x1="253" y1="275" x2="253" y2="320" stroke="#ffc19b" stroke-width="5"/><text x="276" y="301" font-size="16" fill="#ffc19b" text-anchor="start" font-weight="400">image y′</text><text x="122" y="454" font-size="17" fill="#aebfd0" text-anchor="start" font-weight="400">Objects beyond the far plane are clipped.</text><text x="699" y="166" font-size="21" fill="#82b6ff" text-anchor="start" font-weight="600">Similar triangles</text><text x="699" y="224" font-size="24" fill="#eef5f8" text-anchor="start" font-weight="400">y′ / n = y / d</text><text x="699" y="276" font-size="25" fill="#78efce" text-anchor="start" font-weight="400">y′ = n y / d</text><text x="699" y="332" font-size="20" fill="#ffc19b" text-anchor="start" font-weight="400">d = −zview &gt; 0</text><text x="699" y="382" font-size="18" fill="#eef5f8" text-anchor="start" font-weight="400">Farther objects</text><text x="699" y="411" font-size="18" fill="#eef5f8" text-anchor="start" font-weight="400">project smaller.</text><text x="699" y="473" font-size="20" fill="#aebfd0" text-anchor="start" font-weight="400">n &gt; 0, far &gt; n</text><line x1="42" y1="542" x2="958" y2="542" stroke="#26384b" stroke-width="2"/><text x="42" y="565" font-size="15" fill="#aebfd0" text-anchor="start" font-weight="400">This is a side view. The horizontal field of view is also affected by the canvas aspect ratio.</text></g></svg>