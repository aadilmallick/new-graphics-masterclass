84" rx="15" fill="#172337" stroke="#26384b"/><text x="65" y="166" font-size="22" fill="#78efce" text-anchor="start" font-weight="600">JavaScript resources</text><rect x="65" y="202" width="229" height="61" rx="10" fill="#1c2b40" stroke="#82b6ff"/><text x="179" y="239" font-size="21" fill="#82b6ff" text-anchor="middle" font-weight="400">GPUBuffer</text><rect x="65" y="288" width="229" height="61" rx="10" fill="#1c2b40" stroke="#ffc19b"/><text x="179" y="325" font-size="21" fill="#ffc19b" text-anchor="middle" font-weight="400">GPUTextureView</text><rect x="65" y="374" width="229" height="61" rx="10" fill="#1c2b40" stroke="#78efce"/><text x="179" y="411" font-size="21" fill="#78efce" text-anchor="middle" font-weight="400">GPUSampler</text><text x="385" y="166" font-size="22" fill="#82b6ff" text-anchor="start" font-weight="600">Bind group</text><rect x="385" y="202" width="230" height="61" rx="15" fill="#172337" stroke="#26384b"/><text x="499" y="239" font-size="20" fill="#eef5f8" text-anchor="middle" font-weight="400">binding 0: uniform</text><line x1="320" y1="232" x2="358" y2="232" stroke="#aebfd0" stroke-width="2" marker-end="url(#aebfd0)"/><rect x="385" y="288" width="230" height="61" rx="15" fill="#172337" stroke="#26384b"/><text x="499" y="325" font-size="20" fill="#eef5f8" text-anchor="middle" font-weight="400">binding 1: texture</text><line x1="320" y1="318" x2="358" y2="318" stroke="#aebfd0" stroke-width="2" marker-end="url(#aebfd0)"/><rect x="385" y="374" width="230" height="61" rx="15" fill="#172337" stroke="#26384b"/><text x="499" y="411" font-size="20" fill="#eef5f8" text-anchor="middle" font-weight="400">binding 2: sampler</text><line x1="320" y1="404" x2="358" y2="404" stroke="#aebfd0" stroke-width="2" marker-end="url(#aebfd0)"/><text x="705" y="166" font-size="22" fill="#ffc19b" text-anchor="start" font-weight="600">WGSL declarations</text><text x="705" y="219" font-size="19" fill="#78efce" text-anchor="start" font-weight="400">@group(0)</text><text x="705" y="249" font-size="19" fill="#78efce" text-anchor="start" font-weight="400">@binding(0)</text><text x="705" y="282" font-size="16" fill="#eef5f8" text-anchor="start" font-weight="400">var&lt;uniform&gt; camera…</text><text x="705" y="340" font-size="17" fill="#ffc19b" text-anchor="start" font-weight="400">@binding(1) texture…</text><text x="705" y="426" font-size="17" fill="#82b6ff" text-anchor="start" font-weight="400">@binding(2) sampler…</text><line x1="641" y1="295" x2="679" y2="295" stroke="#aebfd0" stroke-width="2" marker-end="url(#aebfd0)"/><text x="65" y="478" font-size="17" fill="#aebfd0" text-anchor="start" font-weight="400">Data is allocated here.</text><text x="385" y="478" font-size="17" fill="#aebfd0" text-anchor="start" font-weight="400">Resources get addresses.</text><text x="705" y="478" font-size="17" fill="#aebfd0" text-anchor="start" font-weight="400">Shader uses addresses.</text><line x1="42" y1="542" x2="958" y2="542" stroke="#26384b" stroke-width="2"/><text x="42" y="565" font-size="15" fill="#aebfd0" text-anchor="start" font-weight="400">pass.setBindGroup(0, group) selects group 0. A binding number is an interface slot, not a byte offset.</text></g></svg>