<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Texture sampling reconstructs a signal</title><desc id="desc">Texel centers and screen pixels are different grids. Filtering bridges them. A full mip chain needs about 4/3 of the base texture storage. Color textures and data textures need different handling.</desc><defs><marker id="78efce" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#78efce"/></marker><marker id="82b6ff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#82b6ff"/></marker><marker id="ffc19b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ffc19b"/></marker><marker id="aebfd0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#aebfd0"/></marker><linearGradient id="surface" x1="0" x2="1" color-interpolation="linearRGB"><stop offset="0" stop-color="#192c42"/><stop offset="0.35" stop-color="#234455"/><stop offset="0.7" stop-color="#2b5c65"/><stop offset="1" stop-color="#488a80"/></linearGradient></defs><rect width="1000" height="600" rx="22" fill="#101827"/><g font-family="Segoe UI, Arial, sans-serif"><text x="42" y="52" font-size="29" fill="#eef5f8" text-anchor="start" font-weight="650">Texture sampling reconstructs a signal</text><text x="42" y="85" font-size="17" fill="#aebfd0" text-anchor="start" font-weight="400">Texel centers and screen pixels are different grids. Filtering bridges them.</text><rect x="42" y="124" width="452" height="390" rx="15" fill="#172337" stroke="#26384b"/><rect x="519" y="124" width="439" height="390" rx="15" fill="#172337" stroke="#26384b"/><text x="65" y="161" font-size="22" fill="#78efce" text-anchor="start" font-weight="600">A texture is a grid of texels</text><rect x="94" y="200" width="150" height="111" rx="0" fill="#f4b68d" stroke="#101827"/><rect x="245" y="200" width="150" height="111" rx="0" fill="#a6d4c7" stroke="#101827"/><rect x="94" y="312" width="150" height="111" rx="0" fill="#92b8ec" stroke="#101827"/><rect x="245" y="312" width="150" height="111" rx="0" fill="#666fad" stroke="#101827"/><circle cx="230" cy="317" r="9" fill="#eef5f8" stroke="#101827"/><text x="65" y="185" font-size="16" fill="#aebfd0" text-anchor="start" font-weight="400">White point: sampling location</text><text x="65" y="479" font-size="18" fill="#aebfd0" text-anchor="start" font-weight="400">Nearest chooses one. Linear blends neighbors.</text><text x="544" y="162" font-size="22" fill="#82b6ff" text-anchor="start" font-weight="600">Bilinear = lerp, then lerp</text><text x="544" y="216" font-size="18" fill="#eef5f8" text-anchor="start" font-weight="400">a = mix(topLeft, topRight, u)</text><text x="544" y="257" font-size="18" fill="#eef5f8" text-anchor="start" font-weight="400">b = mix(bottomLeft, bottomRight, u)</text><text x="544" y="298" font-size="20" fill="#78efce" text-anchor="start" font-weight="400">color = mix(a, b, v)</text><line x1="548" y1="345" x2="920" y2="345" stroke="#26384b" stroke-width="2"/><text x="544" y="384" font-size="20" fill="#ffc19b" text-anchor="start" font-weight="400">Mipmaps prefilter smaller images.</text><text x="544" y="424" font-size="18" fill="#eef5f8" text-anchor="start" font-weight="400">They reduce shimmer when many</text><text x="544" y="452" font-size="18" fill="#eef5f8" text-anchor="start" font-weight="400">texels land on a single pixel.</text><text x="544" y="488" font-size="16" fill="#aebfd0" text-anchor="start" font-weight="400">u and v here are local cell fractions.</text><line x1="42" y1="542" x2="958" y2="542" stroke="#26384b" stroke-width="2"/><text x="42" y="565" font-size="15" fill="#aebfd0" text-anchor="start" font-weight="400">A full mip chain needs about 4/3 of the base texture storage. Color textures and data textures need different</text><text x="42" y="585" font-size="15" fill="#aebfd0" text-anchor="start" font-weight="400">handling.</text></g></svg>