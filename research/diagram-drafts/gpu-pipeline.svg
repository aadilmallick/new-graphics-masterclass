<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">The programmable rendering pipeline</title><desc id="desc">A draw call submits work; JavaScript does not execute the vertex or fragment shaders. Mint stages are your shader programs. Implementations may run early depth tests when the shader permits it.</desc><defs><marker id="78efce" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#78efce"/></marker><marker id="82b6ff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#82b6ff"/></marker><marker id="ffc19b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ffc19b"/></marker><marker id="aebfd0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#aebfd0"/></marker><linearGradient id="surface" x1="0" x2="1" color-interpolation="linearRGB"><stop offset="0" stop-color="#192c42"/><stop offset="0.35" stop-color="#234455"/><stop offset="0.7" stop-color="#2b5c65"/><stop offset="1" stop-color="#488a80"/></linearGradient></defs><rect width="1000" height="600" rx="22" fill="#101827"/><g font-family="Segoe UI, Arial, sans-serif"><text x="42" y="52" font-size="29" fill="#eef5f8" text-anchor="start" font-weight="650">The programmable rendering pipeline</text><text x="42" y="85" font-size="17" fill="#aebfd0" text-anchor="start" font-weight="400">A draw call submits work; JavaScript does not execute the vertex or fragment shaders.</text><rect x="42" y="171" width="167" height="180" rx="15" fill="#172337" stroke="#26384b"/><text x="125" y="211" font-size="26" fill="#82b6ff" text-anchor="middle" font-weight="600">01</text><text x="125" y="259" font-size="18" fill="#eef5f8" text-anchor="middle" font-weight="600">Vertex fetch</text><text x="125" y="310" font-size="13" fill="#aebfd0" text-anchor="middle" font-weight="400">Read buffer attributes</text><line x1="212" y1="260" x2="225" y2="260" stroke="#aebfd0" stroke-width="2" marker-end="url(#aebfd0)"/><rect x="229" y="171" width="167" height="180" rx="15" fill="#172337" stroke="#26384b"/><text x="312" y="211" font-size="26" fill="#78efce" text-anchor="middle" font-weight="600">02</text><text x="312" y="259" font-size="18" fill="#eef5f8" text-anchor="middle" font-weight="600">Vertex shader</text><text x="312" y="310" font-size="13" fill="#aebfd0" text-anchor="middle" font-weight="400">Compute clip position</text><line x1="399" y1="260" x2="412" y2="260" stroke="#aebfd0" stroke-width="2" marker-end="url(#aebfd0)"/><rect x="416" y="171" width="167" height="180" rx="15" fill="#172337" stroke="#26384b"/><text x="499" y="211" font-size="26" fill="#82b6ff" text-anchor="middle" font-weight="600">03</text><text x="499" y="259" font-size="18" fill="#eef5f8" text-anchor="middle" font-weight="600">Clip + rasterize</text><text x="499" y="310" font-size="13" fill="#aebfd0" text-anchor="middle" font-weight="400">Find covered samples</text><line x1="586" y1="260" x2="599" y2="260" stroke="#aebfd0" stroke-width="2" marker-end="url(#aebfd0)"/><rect x="603" y="171" width="167" height="180" rx="15" fill="#172337" stroke="#26384b"/><text x="686" y="211" font-size="26" fill="#78efce" text-anchor="middle" font-weight="600">04</text><text x="686" y="259" font-size="18" fill="#eef5f8" text-anchor="middle" font-weight="600">Fragment shader</text><text x="686" y="310" font-size="13" fill="#aebfd0" text-anchor="middle" font-weight="400">Compute sample color</text><line x1="773" y1="260" x2="786" y2="260" stroke="#aebfd0" stroke-width="2" marker-end="url(#aebfd0)"/><rect x="790" y="171" width="167" height="180" rx="15" fill="#172337" stroke="#26384b"/><text x="873" y="211" font-size="26" fill="#82b6ff" text-anchor="middle" font-weight="600">05</text><text x="873" y="259" font-size="18" fill="#eef5f8" text-anchor="middle" font-weight="600">Depth + blend</text><text x="873" y="310" font-size="13" fill="#aebfd0" text-anchor="middle" font-weight="400">Test and combine</text><rect x="42" y="395" width="916" height="103" rx="15" fill="#172337" stroke="#26384b"/><text x="66" y="432" font-size="20" fill="#ffc19b" text-anchor="start" font-weight="600">CPU / JavaScript</text><text x="66" y="469" font-size="21" fill="#eef5f8" text-anchor="start" font-weight="400">Create resources → upload data → set state or pipeline → issue draw calls</text><line x1="328" y1="396" x2="328" y2="357" stroke="#ffc19b" stroke-width="2" marker-end="url(#ffc19b)"/><text x="43" y="139" font-size="20" fill="#aebfd0" text-anchor="start" font-weight="400">GPU: parallel work with fixed-function stages between programs</text><line x1="42" y1="542" x2="958" y2="542" stroke="#26384b" stroke-width="2"/><text x="42" y="565" font-size="15" fill="#aebfd0" text-anchor="start" font-weight="400">Mint stages are your shader programs. Implementations may run early depth tests when the shader permits it.</text></g></svg>