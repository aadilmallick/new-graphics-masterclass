<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">One point, five coordinate spaces</title><desc id="desc">Column vectors: the rightmost transform acts first. WebGL NDC z: −1…1. WebGPU NDC z: 0…1. Pixel Y orientation is a separate convention.</desc><defs><marker id="78efce" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#78efce"/></marker><marker id="82b6ff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#82b6ff"/></marker><marker id="ffc19b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ffc19b"/></marker><marker id="aebfd0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#aebfd0"/></marker><linearGradient id="surface" x1="0" x2="1" color-interpolation="linearRGB"><stop offset="0" stop-color="#192c42"/><stop offset="0.35" stop-color="#234455"/><stop offset="0.7" stop-color="#2b5c65"/><stop offset="1" stop-color="#488a80"/></linearGradient></defs><rect width="1000" height="600" rx="22" fill="#101827"/><g font-family="Segoe UI, Arial, sans-serif"><text x="42" y="52" font-size="29" fill="#eef5f8" text-anchor="start" font-weight="650">One point, five coordinate spaces</text><text x="42" y="85" font-size="17" fill="#aebfd0" text-anchor="start" font-weight="400">Column vectors: the rightmost transform acts first.</text><rect x="42" y="150" width="167" height="190" rx="15" fill="#172337" stroke="#26384b"/><text x="125" y="184" font-size="23" fill="#78efce" text-anchor="middle" font-weight="600">Local</text><text x="125" y="316" font-size="14" fill="#aebfd0" text-anchor="middle" font-weight="400">mesh coordinates</text><line x1="84" y1="267" x2="169" y2="267" stroke="#78efce" stroke-width="2" marker-end="url(#78efce)"/><line x1="84" y1="267" x2="84" y2="210" stroke="#82b6ff" stroke-width="2" marker-end="url(#82b6ff)"/><path d="M 100 255 L 153 249 L 114 220 Z" stroke="#ffc19b" stroke-width="2" fill="#59483f"/><line x1="210" y1="244" x2="226" y2="244" stroke="#aebfd0" stroke-width="2" marker-end="url(#aebfd0)"/><rect x="229" y="150" width="167" height="190" rx="15" fill="#172337" stroke="#26384b"/><text x="312" y="184" font-size="23" fill="#82b6ff" text-anchor="middle" font-weight="600">World</text><text x="312" y="316" font-size="14" fill="#aebfd0" text-anchor="middle" font-weight="400">shared scene</text><line x1="271" y1="267" x2="356" y2="267" stroke="#78efce" stroke-width="2" marker-end="url(#78efce)"/><line x1="271" y1="267" x2="271" y2="210" stroke="#82b6ff" stroke-width="2" marker-end="url(#82b6ff)"/><path d="M 287 255 L 340 249 L 301 220 Z" stroke="#ffc19b" stroke-width="2" fill="#59483f"/><line x1="397" y1="244" x2="413" y2="244" stroke="#aebfd0" stroke-width="2" marker-end="url(#aebfd0)"/><rect x="416" y="150" width="167" height="190" rx="15" fill="#172337" stroke="#26384b"/><text x="499" y="184" font-size="23" fill="#78efce" text-anchor="middle" font-weight="600">View</text><text x="499" y="316" font-size="14" fill="#aebfd0" text-anchor="middle" font-weight="400">camera at origin</text><line x1="458" y1="267" x2="543" y2="267" stroke="#78efce" stroke-width="2" marker-end="url(#78efce)"/><line x1="458" y1="267" x2="458" y2="210" stroke="#82b6ff" stroke-width="2" marker-end="url(#82b6ff)"/><path d="M 474 255 L 527 249 L 488 220 Z" stroke="#ffc19b" stroke-width="2" fill="#59483f"/><line x1="584" y1="244" x2="600" y2="244" stroke="#aebfd0" stroke-width="2" marker-end="url(#aebfd0)"/><rect x="603" y="150" width="167" height="190" rx="15" fill="#172337" stroke="#26384b"/><text x="686" y="184" font-size="23" fill="#82b6ff" text-anchor="middle" font-weight="600">Clip</text><text x="686" y="316" font-size="14" fill="#aebfd0" text-anchor="middle" font-weight="400">homogeneous xyzw</text><line x1="645" y1="267" x2="730" y2="267" stroke="#78efce" stroke-width="2" marker-end="url(#78efce)"/><line x1="645" y1="267" x2="645" y2="210" stroke="#82b6ff" stroke-width="2" marker-end="url(#82b6ff)"/><path d="M 661 255 L 714 249 L 675 220 Z" stroke="#ffc19b" stroke-width="2" fill="#59483f"/><line x1="771" y1="244" x2="787" y2="244" stroke="#aebfd0" stroke-width="2" marker-end="url(#aebfd0)"/><rect x="790" y="150" width="167" height="190" rx="15" fill="#172337" stroke="#26384b"/><text x="873" y="184" font-size="23" fill="#78efce" text-anchor="middle" font-weight="600">NDC</text><text x="873" y="316" font-size="14" fill="#aebfd0" text-anchor="middle" font-weight="400">divide xyz by w</text><line x1="832" y1="267" x2="917" y2="267" stroke="#78efce" stroke-width="2" marker-end="url(#78efce)"/><line x1="832" y1="267" x2="832" y2="210" stroke="#82b6ff" stroke-width="2" marker-end="url(#82b6ff)"/><path d="M 848 255 L 901 249 L 862 220 Z" stroke="#ffc19b" stroke-width="2" fill="#59483f"/><text x="218" y="394" font-size="26" fill="#78efce" text-anchor="middle" font-weight="400">M</text><text x="405" y="394" font-size="26" fill="#82b6ff" text-anchor="middle" font-weight="400">V = C⁻¹</text><text x="592" y="394" font-size="26" fill="#78efce" text-anchor="middle" font-weight="400">P</text><text x="779" y="394" font-size="26" fill="#82b6ff" text-anchor="middle" font-weight="400">÷ w</text><text x="42" y="465" font-size="28" fill="#ffc19b" text-anchor="start" font-weight="400">pclip = P V M plocal</text><text x="42" y="505" font-size="20" fill="#eef5f8" text-anchor="start" font-weight="400">Viewport then maps NDC to drawing-buffer pixels.</text><line x1="42" y1="542" x2="958" y2="542" stroke="#26384b" stroke-width="2"/><text x="42" y="565" font-size="15" fill="#aebfd0" text-anchor="start" font-weight="400">WebGL NDC z: −1…1. WebGPU NDC z: 0…1. Pixel Y orientation is a separate convention.</text></g></svg>