<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Triangles become samples</title><desc id="desc">Barycentric coordinates express a point as three weights that sum to one. Perspective-correct attributes interpolate a/w and 1/w, then divide. Screen-space weights alone distort UVs.</desc><defs><marker id="78efce" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#78efce"/></marker><marker id="82b6ff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#82b6ff"/></marker><marker id="ffc19b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ffc19b"/></marker><marker id="aebfd0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#aebfd0"/></marker><linearGradient id="surface" x1="0" x2="1" color-interpolation="linearRGB"><stop offset="0" stop-color="#192c42"/><stop offset="0.35" stop-color="#234455"/><stop offset="0.7" stop-color="#2b5c65"/><stop offset="1" stop-color="#488a80"/></linearGradient></defs><rect width="1000" height="600" rx="22" fill="#101827"/><g font-family="Segoe UI, Arial, sans-serif"><text x="42" y="52" font-size="29" fill="#eef5f8" text-anchor="start" font-weight="650">Triangles become samples</text><text x="42" y="85" font-size="17" fill="#aebfd0" text-anchor="start" font-weight="400">Barycentric coordinates express a point as three weights that sum to one.</text><rect x="42" y="124" width="533" height="390" rx="15" fill="#172337" stroke="#26384b"/><rect x="600" y="124" width="358" height="390" rx="15" fill="#172337" stroke="#26384b"/><line x1="70" y1="164" x2="70" y2="452" stroke="#26384b" stroke-width="1"/><line x1="106" y1="164" x2="106" y2="452" stroke="#26384b" stroke-width="1"/><line x1="142" y1="164" x2="142" y2="452" stroke="#26384b" stroke-width="1"/><line x1="178" y1="164" x2="178" y2="452" stroke="#26384b" stroke-width="1"/><line x1="214" y1="164" x2="214" y2="452" stroke="#26384b" stroke-width="1"/><line x1="250" y1="164" x2="250" y2="452" stroke="#26384b" stroke-width="1"/><line x1="286" y1="164" x2="286" y2="452" stroke="#26384b" stroke-width="1"/><line x1="322" y1="164" x2="322" y2="452" stroke="#26384b" stroke-width="1"/><line x1="358" y1="164" x2="358" y2="452" stroke="#26384b" stroke-width="1"/><line x1="394" y1="164" x2="394" y2="452" stroke="#26384b" stroke-width="1"/><line x1="430" y1="164" x2="430" y2="452" stroke="#26384b" stroke-width="1"/><line x1="466" y1="164" x2="466" y2="452" stroke="#26384b" stroke-width="1"/><line x1="502" y1="164" x2="502" y2="452" stroke="#26384b" stroke-width="1"/><line x1="538" y1="164" x2="538" y2="452" stroke="#26384b" stroke-width="1"/><line x1="70" y1="164" x2="538" y2="164" stroke="#26384b" stroke-width="1"/><line x1="70" y1="200" x2="538" y2="200" stroke="#26384b" stroke-width="1"/><line x1="70" y1="236" x2="538" y2="236" stroke="#26384b" stroke-width="1"/><line x1="70" y1="272" x2="538" y2="272" stroke="#26384b" stroke-width="1"/><line x1="70" y1="308" x2="538" y2="308" stroke="#26384b" stroke-width="1"/><line x1="70" y1="344" x2="538" y2="344" stroke="#26384b" stroke-width="1"/><line x1="70" y1="380" x2="538" y2="380" stroke="#26384b" stroke-width="1"/><line x1="70" y1="416" x2="538" y2="416" stroke="#26384b" stroke-width="1"/><line x1="70" y1="452" x2="538" y2="452" stroke="#26384b" stroke-width="1"/><path d="M 129 443 L 501 443 L 315 185 Z" stroke="#82b6ff" stroke-width="3" fill="#25374d"/><path d="M 129 443 L 501 443 L 315 314 Z" stroke="#78efce" stroke-width="1" fill="#2e655b"/><line x1="129" y1="443" x2="315" y2="314" stroke="#ffc19b" stroke-width="2"/><line x1="501" y1="443" x2="315" y2="314" stroke="#ffc19b" stroke-width="2"/><line x1="315" y1="185" x2="315" y2="314" stroke="#ffc19b" stroke-width="2"/><circle cx="129" cy="443" r="6" fill="#78efce" stroke="none"/><text x="141" y="433" font-size="23" fill="#78efce" text-anchor="start" font-weight="400">A</text><circle cx="501" cy="443" r="6" fill="#82b6ff" stroke="none"/><text x="513" y="433" font-size="23" fill="#82b6ff" text-anchor="start" font-weight="400">B</text><circle cx="315" cy="185" r="6" fill="#ffc19b" stroke="none"/><text x="327" y="175" font-size="23" fill="#ffc19b" text-anchor="start" font-weight="400">C</text><circle cx="315" cy="314" r="8" fill="#eef5f8" stroke="none"/><text x="328" y="307" font-size="24" fill="#eef5f8" text-anchor="start" font-weight="400">P</text><text x="67" y="488" font-size="18" fill="#aebfd0" text-anchor="start" font-weight="400">Weights also interpolate colors, UVs, and normals.</text><text x="623" y="163" font-size="22" fill="#78efce" text-anchor="start" font-weight="600">A weighted average</text><text x="623" y="220" font-size="22" fill="#eef5f8" text-anchor="start" font-weight="400">P = ¼ A + ¼ B + ½ C</text><text x="623" y="270" font-size="23" fill="#ffc19b" text-anchor="start" font-weight="400">¼ + ¼ + ½ = 1</text><text x="623" y="323" font-size="20" fill="#eef5f8" text-anchor="start" font-weight="400">Inside: all weights ≥ 0</text><text x="623" y="365" font-size="20" fill="#eef5f8" text-anchor="start" font-weight="400">On an edge: one is 0</text><text x="623" y="407" font-size="20" fill="#eef5f8" text-anchor="start" font-weight="400">Outside: one is negative</text><text x="623" y="478" font-size="18" fill="#aebfd0" text-anchor="start" font-weight="400">Rasterization finds coverage.</text><line x1="42" y1="542" x2="958" y2="542" stroke="#26384b" stroke-width="2"/><text x="42" y="565" font-size="15" fill="#aebfd0" text-anchor="start" font-weight="400">Perspective-correct attributes interpolate a/w and 1/w, then divide. Screen-space weights alone distort UVs.</text></g></svg>