<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Two vector products, two different questions</title><desc id="desc">Dot returns a scalar. Cross in 3D returns a vector; swapping inputs flips its sign. Normalize nonzero vectors before using the dot product as cos θ. A zero vector has no direction.</desc><defs><marker id="78efce" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#78efce"/></marker><marker id="82b6ff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#82b6ff"/></marker><marker id="ffc19b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ffc19b"/></marker><marker id="aebfd0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#aebfd0"/></marker><linearGradient id="surface" x1="0" x2="1" color-interpolation="linearRGB"><stop offset="0" stop-color="#192c42"/><stop offset="0.35" stop-color="#234455"/><stop offset="0.7" stop-color="#2b5c65"/><stop offset="1" stop-color="#488a80"/></linearGradient></defs><rect width="1000" height="600" rx="22" fill="#101827"/><g font-family="Segoe UI, Arial, sans-serif"><text x="42" y="52" font-size="29" fill="#eef5f8" text-anchor="start" font-weight="650">Two vector products, two different questions</text><text x="42" y="85" font-size="17" fill="#aebfd0" text-anchor="start" font-weight="400">Dot returns a scalar. Cross in 3D returns a vector; swapping inputs flips its sign.</text><rect x="42" y="123" width="440" height="390" rx="15" fill="#172337" stroke="#26384b"/><rect x="508" y="123" width="450" height="390" rx="15" fill="#172337" stroke="#26384b"/><text x="68" y="158" font-size="23" fill="#78efce" text-anchor="start" font-weight="600">Dot product = alignment</text><line x1="74" y1="192" x2="74" y2="444" stroke="#26384b" stroke-width="1"/><line x1="110" y1="192" x2="110" y2="444" stroke="#26384b" stroke-width="1"/><line x1="146" y1="192" x2="146" y2="444" stroke="#26384b" stroke-width="1"/><line x1="182" y1="192" x2="182" y2="444" stroke="#26384b" stroke-width="1"/><line x1="218" y1="192" x2="218" y2="444" stroke="#26384b" stroke-width="1"/><line x1="254" y1="192" x2="254" y2="444" stroke="#26384b" stroke-width="1"/><line x1="290" y1="192" x2="290" y2="444" stroke="#26384b" stroke-width="1"/><line x1="326" y1="192" x2="326" y2="444" stroke="#26384b" stroke-width="1"/><line x1="362" y1="192" x2="362" y2="444" stroke="#26384b" stroke-width="1"/><line x1="398" y1="192" x2="398" y2="444" stroke="#26384b" stroke-width="1"/><line x1="434" y1="192" x2="434" y2="444" stroke="#26384b" stroke-width="1"/><line x1="74" y1="192" x2="434" y2="192" stroke="#26384b" stroke-width="1"/><line x1="74" y1="228" x2="434" y2="228" stroke="#26384b" stroke-width="1"/><line x1="74" y1="264" x2="434" y2="264" stroke="#26384b" stroke-width="1"/><line x1="74" y1="300" x2="434" y2="300" stroke="#26384b" stroke-width="1"/><line x1="74" y1="336" x2="434" y2="336" stroke="#26384b" stroke-width="1"/><line x1="74" y1="372" x2="434" y2="372" stroke="#26384b" stroke-width="1"/><line x1="74" y1="408" x2="434" y2="408" stroke="#26384b" stroke-width="1"/><line x1="74" y1="444" x2="434" y2="444" stroke="#26384b" stroke-width="1"/><line x1="130" y1="416" x2="406" y2="416" stroke="#78efce" stroke-width="4" marker-end="url(#78efce)"/><line x1="130" y1="416" x2="296" y2="250" stroke="#82b6ff" stroke-width="4" marker-end="url(#82b6ff)"/><line x1="296" y1="250" x2="296" y2="416" stroke="#ffc19b" stroke-width="2" stroke-dasharray="6 6"/><text x="315" y="445" font-size="18" fill="#78efce" text-anchor="start" font-weight="400">a = (3, 0)</text><text x="264" y="239" font-size="18" fill="#82b6ff" text-anchor="start" font-weight="400">b = (1.8, 1.8)</text><text x="160" y="392" font-size="19" fill="#ffc19b" text-anchor="start" font-weight="400">45°</text><path d="M 195 416 A 65 65 0 0 0 176 370" stroke="#ffc19b" stroke-width="2" fill="none"/><text x="68" y="486" font-size="23" fill="#eef5f8" text-anchor="start" font-weight="400">a · b = |a| |b| cos θ</text><text x="534" y="158" font-size="23" fill="#82b6ff" text-anchor="start" font-weight="600">Cross product = oriented area</text><path d="M 605 383 L 829 383 L 880 265 L 656 265 Z" stroke="#78efce" stroke-width="2" fill="#203d43"/><line x1="605" y1="383" x2="829" y2="383" stroke="#78efce" stroke-width="4" marker-end="url(#78efce)"/><line x1="605" y1="383" x2="656" y2="265" stroke="#82b6ff" stroke-width="4" marker-end="url(#82b6ff)"/><circle cx="605" cy="383" r="5" fill="#eef5f8" stroke="none"/><line x1="706" y1="326" x2="706" y2="206" stroke="#ffc19b" stroke-width="4" marker-end="url(#ffc19b)"/><text x="720" y="228" font-size="22" fill="#ffc19b" text-anchor="start" font-weight="400">a × b</text><text x="747" y="411" font-size="22" fill="#78efce" text-anchor="start" font-weight="400">a</text><text x="614" y="290" font-size="22" fill="#82b6ff" text-anchor="start" font-weight="400">b</text><text x="534" y="451" font-size="20" fill="#eef5f8" text-anchor="start" font-weight="400">Perpendicular to both a and b.</text><text x="534" y="486" font-size="23" fill="#eef5f8" text-anchor="start" font-weight="400">|a × b| = |a| |b| sin θ</text><line x1="42" y1="542" x2="958" y2="542" stroke="#26384b" stroke-width="2"/><text x="42" y="565" font-size="15" fill="#aebfd0" text-anchor="start" font-weight="400">Normalize nonzero vectors before using the dot product as cos θ. A zero vector has no direction.</text></g></svg>