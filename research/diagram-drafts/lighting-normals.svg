<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Lighting begins with surface direction</title><desc id="desc">Both vectors must use the same coordinate space before taking their dot product. The normal matrix is the inverse transpose of the relevant nonsingular linear transform; translation does not affect directions.</desc><defs><marker id="78efce" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#78efce"/></marker><marker id="82b6ff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#82b6ff"/></marker><marker id="ffc19b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ffc19b"/></marker><marker id="aebfd0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#aebfd0"/></marker><linearGradient id="surface" x1="0" x2="1" color-interpolation="linearRGB"><stop offset="0" stop-color="#192c42"/><stop offset="0.35" stop-color="#234455"/><stop offset="0.7" stop-color="#2b5c65"/><stop offset="1" stop-color="#488a80"/></linearGradient></defs><rect width="1000" height="600" rx="22" fill="#101827"/><g font-family="Segoe UI, Arial, sans-serif"><text x="42" y="52" font-size="29" fill="#eef5f8" text-anchor="start" font-weight="650">Lighting begins with surface direction</text><text x="42" y="85" font-size="17" fill="#aebfd0" text-anchor="start" font-weight="400">Both vectors must use the same coordinate space before taking their dot product.</text><rect x="42" y="124" width="506" height="390" rx="15" fill="#172337" stroke="#26384b"/><rect x="573" y="124" width="385" height="390" rx="15" fill="#172337" stroke="#26384b"/><path d="M 88 430 L 471 430 L 501 363 L 119 363 Z" stroke="#78efce" stroke-width="2" fill="url(#surface)"/><line x1="285" y1="382" x2="285" y2="192" stroke="#78efce" stroke-width="4" marker-end="url(#78efce)"/><text x="295" y="211" font-size="20" fill="#78efce" text-anchor="start" font-weight="400">unit normal n</text><line x1="285" y1="382" x2="434" y2="227" stroke="#ffc19b" stroke-width="4" marker-end="url(#ffc19b)"/><text x="433" y="219" font-size="20" fill="#ffc19b" text-anchor="start" font-weight="400">to light ℓ</text><path d="M 285 292 A 90 90 0 0 1 347 317" stroke="#82b6ff" stroke-width="2" fill="none"/><text x="309" y="287" font-size="23" fill="#82b6ff" text-anchor="start" font-weight="400">θ</text><text x="67" y="482" font-size="18" fill="#aebfd0" text-anchor="start" font-weight="400">Normal = perpendicular direction to a surface.</text><text x="598" y="166" font-size="22" fill="#78efce" text-anchor="start" font-weight="600">Lambert diffuse</text><text x="598" y="225" font-size="21" fill="#eef5f8" text-anchor="start" font-weight="400">brightness = max(0, n · ℓ)</text><text x="598" y="278" font-size="18" fill="#ffc19b" text-anchor="start" font-weight="400">Front-lit: θ = 0°, value = 1</text><text x="598" y="317" font-size="18" fill="#eef5f8" text-anchor="start" font-weight="400">Grazing: θ = 90°, value = 0</text><text x="598" y="377" font-size="19" fill="#aebfd0" text-anchor="start" font-weight="400">After non-uniform scaling:</text><text x="598" y="421" font-size="27" fill="#82b6ff" text-anchor="start" font-weight="400">n′ ∝ (M⁻¹)ᵀ n</text><text x="598" y="479" font-size="18" fill="#eef5f8" text-anchor="start" font-weight="400">Normalize n′ before shading.</text><line x1="42" y1="542" x2="958" y2="542" stroke="#26384b" stroke-width="2"/><text x="42" y="565" font-size="15" fill="#aebfd0" text-anchor="start" font-weight="400">The normal matrix is the inverse transpose of the relevant nonsingular linear transform; translation does not</text><text x="42" y="585" font-size="15" fill="#aebfd0" text-anchor="start" font-weight="400">affect directions.</text></g></svg>